version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: db-container
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: citizens_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  rest-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restful-container
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: appuser
      DB_PASSWORD: apppassword
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  dbdata:

networks:
  app-network:
    driver: bridge
